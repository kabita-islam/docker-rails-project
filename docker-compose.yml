version: '3.8'
services:
  ride:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
    depends_on:
      - db
      - redis
    environment:
      REDIS_URL: redis://redis:6379/1
    command: bash -c "bundle install && rails server -b 0.0.0.0"
  db:
    image: postgres:13 
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: rides
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  db_data: